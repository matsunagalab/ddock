[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ddock"
version = "0.1.0"
description = "Differentiable ZDOCK in PyTorch — end-to-end trainable protein–protein docking scoring"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "matsunagalab" }]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "h5py>=3.8",
    "scipy>=1.15.3",
]

[project.optional-dependencies]
test = ["pytest>=7.0", "pytest-xdist>=3"]
plot = ["matplotlib>=3.7"]

[dependency-groups]
# PEP 735 groups — `uv sync` installs these by default.
dev = [
    "pytest>=7.0",
    "pytest-xdist>=3",
    "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
# Exclude `slow` tests by default (training / benchmark runs). Enable with
# `uv run pytest -m slow` for the long-running convergence test.
addopts = ["-m", "not slow"]
markers = [
    "slow: long-running training / benchmark tests (opt-in with -m slow)",
]

# ---------------------------------------------------------------------------
# uv configuration — routes torch to the right wheel per platform so that
# `uv sync` "just works" on macOS (MPS) and Linux (CUDA 12.4).
#
#   macOS    → PyPI torch wheel (bundles Metal / MPS support)
#   Linux    → PyTorch's own CUDA index (cu124 wheels)
#
# For a CPU-only Linux install, override the resolution with
#   `uv sync --index https://pypi.org/simple --reinstall-package torch`.
# ---------------------------------------------------------------------------
[tool.uv]
package = true
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux'",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
    # macOS: default PyPI wheel — MPS support baked in since torch 2.0.
]
